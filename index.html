<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КиберЩит: Безопасный маршрут домой</title>
    <style>
      /* Убираем все отступы и рамки, чтобы iframe занимал 100% экрана */
      body, html {
        margin: 0;
        padding: 0;
        overflow: hidden; /* Скрываем полосы прокрутки */
        width: 100%;
        height: 100%;
        background-color: #000000; /* Чёрный фон на случай загрузки */
      }
      
      iframe {
        width: 100vw;
        height: 100vh;
        border: none;
        display: block;
        /* Важно для мобильных устройств, чтобы не было зума */
        touch-action: none; 
      }
    </style>
  </head>
  <body>
    <!-- Ссылка на игру в Seaverse -->
    <iframe src="https://seaverse.ai/apps/JZ57bYcDy9DewSEz" allowfullscreen></iframe>
  </body>
</html>
